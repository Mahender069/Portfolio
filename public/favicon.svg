<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="geometricPrecision">
  <style>
    .tile { fill: #101010; }
    .mark { fill: #E8E5DF; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #E8E5DF; }
      .mark { fill: #101010; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14" />
  <text class="mark" x="32" y="34" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">M</text>
</svg>
