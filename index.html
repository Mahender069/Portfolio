<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="I craft scalable backend systems and build intelligent AI-powered solutions that ship." />
    <meta property="og:title" content="Mahender — Backend &amp; AI Engineer" />
    <meta property="og:description" content="I craft scalable backend systems and build intelligent AI-powered solutions that ship." />
    <meta property="og:type" content="website" />
    <title>Mahender</title>
  </head>
  <body>
    <script>
      (function() {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch(e) {}
        if (!t) { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
        document.documentElement.setAttribute('data-theme', t);
        var c = t === 'dark' ? '#101010' : '#F5F7FA';
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', c);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  <!-- swarm-cursors:start -->
<script src="/swarm-cursors.js" defer></script>
<!-- swarm-cursors:end -->
</body>
</html>
